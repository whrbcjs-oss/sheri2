name: Assemble Sheri2 update archive
on:
  push:
    branches: [download-20261114-17]
    paths: [staging/outsource-58.complete]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified archive
        shell: bash
        run: |
          mkdir -p downloads
          cat staging/outsource-58.part-* | base64 --decode > downloads/sheri2-outsource-settlement-20261123.58.zip
          echo "ee6a3d3e8eebfaf9b320dc31ee3a07919340462ffd948d4b15a95375db8325a4  downloads/sheri2-outsource-settlement-20261123.58.zip" | sha256sum --check -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/sheri2-outsource-settlement-20261123.58.zip
          git commit -m "Add Sheri2 subcontract settlement update 2026.11.23.58"
          git push
